<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>AEGIS v1.0</title>

        <style>
            body {
                  margin: 0;
                        font-family: Arial, sans-serif;
                              background: #080d18;
                                    color: white;
                                          text-align: center;
                                                padding: 30px 20px;
                                                    }

                                                        .panel {
                                                              max-width: 400px;
                                                                    margin: 50px auto;
                                                                          padding: 30px 20px;
                                                                                border: 1px solid #00e5ff;
                                                                                      border-radius: 20px;
                                                                                            background: #111a2b;
                                                                                                  box-shadow: 0 0 20px #003b50;
                                                                                                      }

                                                                                                          .logo {
                                                                                                                font-size: 55px;
                                                                                                                      margin: 10px;
                                                                                                                          }

                                                                                                                              h1 {
                                                                                                                                    color: #00e5ff;
                                                                                                                                          letter-spacing: 5px;
                                                                                                                                              }

                                                                                                                                                  p {
                                                                                                                                                        color: #bdc9dc;
                                                                                                                                                            }

                                                                                                                                                                button {
                                                                                                                                                                      margin-top: 20px;
                                                                                                                                                                            padding: 14px 25px;
                                                                                                                                                                                  border: 0;
                                                                                                                                                                                        border-radius: 12px;
                                                                                                                                                                                              background: #00e5ff;
                                                                                                                                                                                                    color: #08111d;
                                                                                                                                                                                                          font-size: 16px;
                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                    }

                                                                                                                                                                                                                        #status {
                                                                                                                                                                                                                              margin-top: 20px;
                                                                                                                                                                                                                                    color: #00e5ff;
                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                          </style>
                                                                                                                                                                                                                                          </head>

                                                                                                                                                                                                                                          <body>
                                                                                                                                                                                                                                            <div class="panel">
                                                                                                                                                                                                                                                <div class="logo">🛡️</div>

                                                                                                                                                                                                                                                    <h1>AEGIS</h1>
                                                                                                                                                                                                                                                        <p>Personal AI Assistant</p>
                                                                                                                                                                                                                                                            <p>Versi 1.0 — Sistem Permulaan</p>

                                                                                                                                                                                                                                                                <button onclick="mulaAEGIS()">
                                                                                                                                                                                                                                                                      AKTIFKAN AEGIS
                                                                                                                                                                                                                                                                          </button>

                                                                                                                                                                                                                                                                              <div id="status">Sistem bersedia.</div>
                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                  <script>
                                                                                                                                                                                                                                                                                      function mulaAEGIS() {
                                                                                                                                                                                                                                                                                            document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                    "AEGIS v1.0 berjaya diaktifkan!";
                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                          </script>
                                                                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                                                                          </html>
